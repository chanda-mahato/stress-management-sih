version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: sentinel_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    # Port 8000 is intentionally NOT exposed to host; routed securely through Nginx
    expose:
      - '8000'
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_HOST=${TURN_HOST}
      - TURN_PORT=${TURN_PORT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      coturn:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    # Port 5432 is strictly unexposed to host network in production
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    # Port 6379 is strictly unexposed to host network in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  coturn:
    image: coturn/coturn:4.6.2
    container_name: sentinel_coturn
    restart: unless-stopped
    command:
      - -a
      - -v
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=sentinel.local
      - --min-port=49152
      - --max-port=49200
    ports:
      - '3478:3478/tcp'
      - '3478:3478/udp'
      - '49152-49200:49152-49200/udp'
    environment:
      - TURN_SECRET=${TURN_SECRET}
    networks:
      - sentinel_net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M

networks:
  sentinel_net:
    driver: bridge

volumes:
  pgdata_prod:
