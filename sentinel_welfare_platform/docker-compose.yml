version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql://sentinel_admin:REDACTED_SECRET@postgres:5432/sentinel_welfare
      - REDIS_URL=redis://redis:6379/0
      - TURN_SECRET=REDACTED_SECRET
      - TURN_HOST=coturn
      - TURN_PORT=3478
      - JWT_SECRET=REDACTED_SECRET
    depends_on:
      - postgres
      - redis
      - coturn

  postgres:
    image: postgres:15-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sentinel_admin
      - POSTGRES_PASSWORD=REDACTED_SECRET
      - POSTGRES_DB=sentinel_welfare
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  coturn:
    image: coturn/coturn:4.6.2
    container_name: sentinel_coturn
    restart: unless-stopped
    ports:
      - '3478:3478/tcp'
      - '3478:3478/udp'
      - '49152-49200:49152-49200/udp'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SECRET=REDACTED_SECRET

volumes:
  pgdata:
