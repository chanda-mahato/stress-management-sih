# Coturn Configuration for Sentinel Welfare Platform (SIH PS 26186)
# Security Directive: Private, self-hosted NAT traversal only. Zero public relays.

listening-port=3478
tls-listening-port=5349
realm=sentinel.local

# Authentication via long-term credentials / HMAC-SHA1 timestamp mechanism
use-auth-secret
static-auth-secret=REDACTED_SECRET

# Relay IP configuration
min-port=49152
max-port=49200
fingerprint
lt-cred-mech

# Disable insecure protocols
no-multicast-peers
no-cli
no-loopback-peers
