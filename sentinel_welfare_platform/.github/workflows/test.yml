name: Sentinel Welfare Platform CI - Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-acceptance-tests:
    name: Backend Acceptance Tests (Isolated Suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite (Zero Pre-existing Database)
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci_test_jwt_secret_token_hex_32_secure_runner_key
          TURN_SECRET: ci_test_turn_secret_token_hex_32_secure_runner_key
        run: |
          cd backend
          pytest tests/ -v
